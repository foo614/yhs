extensions:
  bearertokenauth/ingest:
    token: ${env:OTEL_COLLECTOR_INGEST_TOKEN}
  basicauth/grafana_cloud:
    client_auth:
      username: ${env:GRAFANA_CLOUD_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_OTLP_API_TOKEN}
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/ingest
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: [127.0.0.1:8888]
  host_metrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      paging:
      disk:
        include:
          devices: ["^(sd|vd|xvd|nvme).*$"]
          match_type: regexp
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict
        exclude_fs_types:
          fs_types: ["^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|overlay|proc|pstore|securityfs|sysfs|tmpfs|tracefs)$"]
          match_type: regexp
        metrics:
          system.filesystem.utilization:
            enabled: true
      network:
        include:
          interfaces: ["^(eth|ens|enp)[0-9a-z]+$"]
          match_type: regexp

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 64
  resource/production:
    attributes:
      - key: deployment.environment.name
        action: upsert
        value: production
      - key: service.namespace
        action: upsert
        value: ysheng
  resource/host:
    attributes:
      - key: service.name
        action: upsert
        value: ysheng-vps-host
      - key: service.instance.id
        action: upsert
        value: production-vps
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/aspire:
    endpoint: production-dashboard:18889
    tls:
      insecure: true
    headers:
      x-otlp-api-key: ${env:ASPIRE_DASHBOARD_OTLP_API_KEY}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana_cloud
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [bearertokenauth/ingest, basicauth/grafana_cloud, health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/production, batch]
      exporters: [otlp/aspire, otlphttp/grafana_cloud]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [memory_limiter, resource/production, batch]
      exporters: [otlp/aspire, otlphttp/grafana_cloud]
    metrics/host:
      receivers: [host_metrics]
      processors: [memory_limiter, resource/production, resource/host, batch]
      exporters: [otlp/aspire, otlphttp/grafana_cloud]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/production, batch]
      exporters: [otlp/aspire, otlphttp/grafana_cloud]
