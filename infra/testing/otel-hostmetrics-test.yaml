receivers:
  host_metrics:
    collection_interval: 1s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        include_mount_points:
          mount_points: ["/"]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true
      network:
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      exporters: [debug]
