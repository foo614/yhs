services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      Ocr__GoogleDocumentAi__ProjectId: ${GOOGLE_DOCUMENT_AI_PROJECT_ID}
      Ocr__GoogleDocumentAi__Location: ${GOOGLE_DOCUMENT_AI_LOCATION}
      Ocr__GoogleDocumentAi__DefaultProcessorId: ${GOOGLE_DOCUMENT_AI_DEFAULT_PROCESSOR_ID}
      Ocr__GoogleDocumentAi__InvoiceProcessorId: ${GOOGLE_DOCUMENT_AI_INVOICE_PROCESSOR_ID:-}
      Ocr__GoogleDocumentAi__ExpenseProcessorId: ${GOOGLE_DOCUMENT_AI_EXPENSE_PROCESSOR_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-document-ai.json
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH}
        target: /run/secrets/google-document-ai.json
        read_only: true

  worker:
    restart: unless-stopped

  frontoffice:
    restart: unless-stopped

  backoffice:
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      TLS_EMAIL: ${TLS_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      FRONTOFFICE_DOMAIN: ${FRONTOFFICE_DOMAIN}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontoffice:
        condition: service_healthy
      backoffice:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
