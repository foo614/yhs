name: Build, test and deploy
run-name: >-
  ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production && 'Production deployment' || 'Validation' }} | ${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified main commit to Shinjiru production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      frontoffice: ${{ steps.scope.outputs.frontoffice }}
      backoffice: ${{ steps.scope.outputs.backoffice }}
      api: ${{ steps.scope.outputs.api }}
      deployment: ${{ steps.scope.outputs.deployment }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            printf 'frontoffice=true\nbackoffice=true\napi=true\ndeployment=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/ysheng-ci-changed-files.txt"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed_files"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" "$HEAD_SHA" > "$changed_files"
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$changed_files"
          fi

          cat "$changed_files"
          bash .github/scripts/classify-ci-scope.sh < "$changed_files" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web apps
    needs: changes
    if: ${{ needs.changes.outputs.frontoffice == 'true' || needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check front office
        if: ${{ needs.changes.outputs.frontoffice == 'true' }}
        run: npm --workspace apps/frontoffice run lint

      - name: Test front office
        if: ${{ needs.changes.outputs.frontoffice == 'true' }}
        run: npm --workspace apps/frontoffice run test

      - name: Build front office
        if: ${{ needs.changes.outputs.frontoffice == 'true' }}
        run: npm --workspace apps/frontoffice run build

      - name: Type-check back office
        if: ${{ needs.changes.outputs.backoffice == 'true' }}
        run: npm --workspace apps/backoffice run lint

      - name: Test back office
        if: ${{ needs.changes.outputs.backoffice == 'true' }}
        run: npm --workspace apps/backoffice run test

      - name: Build back office
        if: ${{ needs.changes.outputs.backoffice == 'true' }}
        run: npm --workspace apps/backoffice run build

  responsive:
    name: Responsive layouts (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: ${{ needs.changes.outputs.backoffice == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 3
          - shard: 2
            total: 3
          - shard: 3
            total: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install responsive test browser
        run: npm exec --workspace apps/backoffice -- playwright install --with-deps --only-shell chromium

      - name: Check back-office responsive layouts
        env:
          RESPONSIVE_OUTPUT: ../../artifacts/responsive/${{ matrix.shard }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ../../artifacts/responsive/${{ matrix.shard }}/blob-report
          PLAYWRIGHT_BLOB_OUTPUT_FILE: ../../artifacts/responsive/${{ matrix.shard }}/blob-report/report-${{ matrix.shard }}.zip
          RESPONSIVE_VISUAL_EVIDENCE: ${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '1' || '0' }}
        run: npm --workspace apps/backoffice run test:responsive -- --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-responsive-${{ matrix.shard }}
          path: |
            artifacts/responsive/${{ matrix.shard }}
            !artifacts/responsive/${{ matrix.shard }}/blob-report
          if-no-files-found: ignore

      - name: Upload responsive Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-responsive-blob-${{ matrix.shard }}
          path: artifacts/responsive/${{ matrix.shard }}/blob-report
          if-no-files-found: ignore

  responsive-report:
    name: Merge responsive Playwright report
    if: ${{ always() && (needs.responsive.result == 'success' || needs.responsive.result == 'failure') }}
    needs: responsive
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download responsive shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backoffice-responsive-blob-*
          path: artifacts/responsive-blob-reports
          merge-multiple: true

      - name: Merge Playwright blob reports
        working-directory: apps/backoffice
        run: npm exec -- playwright merge-reports --reporter html ../../artifacts/responsive-blob-reports

      - name: Upload merged responsive report
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-responsive-report
          path: apps/backoffice/playwright-report
          if-no-files-found: error

  api:
    name: .NET API
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: whatsapp_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: whatsapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API solution
        run: dotnet restore services/api/YSHeng.sln

      - name: Test API solution
        env:
          WHATSAPP_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=whatsapp_ci;Username=whatsapp_ci;Password=isolated_ci_only
        run: dotnet test services/api/YSHeng.sln --no-restore

  deployment-contracts:
    name: Deployment contracts
    needs: changes
    if: ${{ needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Aspire AppHost
        run: dotnet build services/api/src/YSHeng.AppHost/YSHeng.AppHost.csproj

      - name: Check Aspire AppHost contract
        shell: pwsh
        run: ./infra/test-aspire-apphost.ps1

      - name: Publish Aspire Docker Compose artifact
        shell: pwsh
        run: ./infra/publish-aspire-compose.ps1

      - name: Check Aspire Docker Compose artifact
        shell: pwsh
        run: ./infra/test-aspire-compose-artifact.ps1

      - name: Check merged Aspire production Compose dashboard
        shell: pwsh
        run: ./infra/test-aspire-production-compose.ps1

      - name: Check OpenTelemetry Collector fan-out
        shell: pwsh
        run: ./infra/test-otel-collector.ps1

      - name: Check Aspire /ops login proxy
        shell: pwsh
        run: ./infra/test-ops-dashboard-proxy.ps1

      - name: Upload Aspire Compose artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspire-compose
          path: infra/aspire-output
          if-no-files-found: error

      - name: Check Dockerfiles
        shell: pwsh
        run: ./infra/test-dockerfiles.ps1

      - name: Check Docker Compose contract
        shell: pwsh
        run: ./infra/test-compose-contract.ps1

      - name: Check Compose env validation
        shell: pwsh
        run: ./infra/test-compose-env.ps1

      - name: Check deployment scripts
        shell: pwsh
        run: ./infra/test-deployment-scripts.ps1

      - name: Check CI scope classifier
        shell: bash
        run: bash infra/test-ci-scope.sh

      - name: Check deployment runbook
        shell: pwsh
        run: ./infra/test-deployment-runbook.ps1

      - name: Check Ubuntu production deployment assets
        shell: pwsh
        run: ./infra/test-ubuntu-deployment.ps1

      - name: Check Ubuntu deployment script syntax
        shell: bash
        run: |
          bash infra/test-component-deployment.sh
          bash -n infra/ubuntu/bootstrap-shinjiru.sh
          bash -n infra/ubuntu/classify-production-components.sh
          bash -n infra/ubuntu/deploy-production.sh
          bash -n infra/ubuntu/validate-production-env.sh
          bash -n infra/ubuntu/backup-postgres.sh
          bash -n infra/ubuntu/production-smoke.sh

      - name: Check requirements trace
        shell: pwsh
        run: ./infra/test-requirements-trace.ps1

      - name: Check source requirements crosscheck
        shell: pwsh
        run: ./infra/test-source-requirements-crosscheck.ps1

      - name: Check Stitch visual handoff
        shell: pwsh
        run: ./infra/test-stitch-reference-handoff.ps1

  deploy-production:
    name: Deploy production (Shinjiru Ubuntu)
    needs:
      - web
      - responsive
      - api
      - deployment-contracts
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ysheng-production-deployment
      cancel-in-progress: false
    environment: production

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Download verified Aspire Compose artifact
        uses: actions/download-artifact@v4
        with:
          name: aspire-compose
          path: infra/aspire-output

      - name: Deploy over verified SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SHIJIRU_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.SHIJIRU_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SHIJIRU_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SHIJIRU_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SHIJIRU_KNOWN_HOSTS }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set SHIJIRU_HOST in the production environment.}"
          : "${DEPLOY_USER:?Set SHIJIRU_DEPLOY_USER in the production environment.}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set SHIJIRU_SSH_PRIVATE_KEY in the production environment.}"
          : "${DEPLOY_KNOWN_HOSTS:?Set SHIJIRU_KNOWN_HOSTS in the production environment.}"
          : "${PRODUCTION_ENV_FILE:?Set PRODUCTION_ENV_FILE in the production environment.}"
          DEPLOY_SSH_PORT="${DEPLOY_SSH_PORT:-22}"
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "SHIJIRU_DEPLOY_USER is not a valid Linux username." >&2; exit 1; }
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "SHIJIRU_SSH_PORT must be numeric." >&2; exit 1; }

          ssh_dir="$RUNNER_TEMP/ysheng-ssh"
          env_file="$RUNNER_TEMP/ysheng-production.env"
          install -d -m 700 "$ssh_dir"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s' "$PRODUCTION_ENV_FILE" > "$env_file"
          trap 'rm -f "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$env_file"' EXIT

          ssh_command=(ssh -p "$DEPLOY_SSH_PORT" -i "$ssh_dir/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")
          ssh_target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_stage=".cache/ysheng/releases/$GITHUB_SHA"

          current_release_sha="$("${ssh_command[@]}" "$ssh_target" "basename \"\$(readlink -f /opt/ysheng/current 2>/dev/null)\" 2>/dev/null || true")"
          deploy_components="full"
          history_ready="true"
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]] && ! git fetch --no-tags --unshallow origin main; then
            history_ready="false"
          fi
          if [[ "$history_ready" == "true" && "$current_release_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$current_release_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$current_release_sha" "$GITHUB_SHA"; then
            deploy_components="$(git diff --name-only --no-renames "$current_release_sha" "$GITHUB_SHA" | bash infra/ubuntu/classify-production-components.sh)"
          else
            echo "Production baseline is unavailable or unsafe to compare; using full deployment."
          fi
          local_env_sha="$(sha256sum "$env_file" | awk '{print $1}')"
          remote_env_digest_line="$("${ssh_command[@]}" "$ssh_target" "sha256sum /opt/ysheng/shared/.env 2>/dev/null || true")"
          remote_env_sha="${remote_env_digest_line%% *}"
          if [[ ! "$remote_env_sha" =~ ^[0-9a-f]{64}$ || "$remote_env_sha" != "$local_env_sha" ]]; then
            echo "Production environment changed or has no trusted baseline; using full deployment."
            deploy_components="full"
          fi
          echo "Production deployment scope: $deploy_components (baseline: ${current_release_sha:-unknown}, target: $GITHUB_SHA)"
          printf '### Production deployment scope\n\n- Components: `%s`\n- Baseline: `%s`\n- Target: `%s`\n' "$deploy_components" "${current_release_sha:-unknown}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$deploy_components" == "none" ]]; then
            echo "No production application changes; skipping upload, bootstrap, and rollout."
            exit 0
          fi

          "${ssh_command[@]}" "$ssh_target" "mkdir -p '$remote_stage'"
          git archive --format=tar "$GITHUB_SHA" | "${ssh_command[@]}" "$ssh_target" "tar -xf - -C '$remote_stage'"
          tar -C infra/aspire-output -cf - . | "${ssh_command[@]}" "$ssh_target" "mkdir -p '$remote_stage/infra/aspire-output'; tar -xf - -C '$remote_stage/infra/aspire-output'"
          "${ssh_command[@]}" "$ssh_target" "sudo -n /bin/bash '$remote_stage/infra/ubuntu/bootstrap-shinjiru.sh' --deploy-user '$DEPLOY_USER' --release-dir '$remote_stage' --ssh-port '$DEPLOY_SSH_PORT'"
          cat "$env_file" | "${ssh_command[@]}" "$ssh_target" "umask 077; cat > /opt/ysheng/shared/.env"
          "${ssh_command[@]}" "$ssh_target" "bash '/opt/ysheng/releases/$GITHUB_SHA/infra/ubuntu/deploy-production.sh' --release-dir '/opt/ysheng/releases/$GITHUB_SHA' --env-file /opt/ysheng/shared/.env --components '$deploy_components'"
