name: Back-office real E2E pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-real-e2e-pilot
  cancel-in-progress: true

env:
  E2E_OUTPUT_DIR: artifacts/e2e-pilot
  E2E_BASE_URL: http://127.0.0.1:4176
  E2E_API_BASE_URL: http://127.0.0.1:5000
  E2E_ADMIN_EMAIL: e2e-admin@ysheng.local
  E2E_ADMIN_PASSWORD: E2ePilot123!
  E2E_SALES_EMAIL: hr-sales@ysheng.local
  E2E_SALES_PASSWORD: E2ePilot123!
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://127.0.0.1:5000
  ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=e2e_pilot;Username=e2e_pilot;Password=e2e_pilot_only
  AllowedOrigins__0: http://127.0.0.1:4176
  SeedData__Enabled: true
  E2E_PILOT_DB_SENTINEL: YSHENG_E2E_PILOT
  SeedAdmin__Email: e2e-admin@ysheng.local
  SeedAdmin__Password: E2ePilot123!
  Worker__Enabled: false
  WhatsApp__CaptureEnabled: false
  WhatsApp__SendingEnabled: false
  WhatsApp__StaffCaptureEnabled: false
  WhatsApp__StaffSendingEnabled: false
  WhatsApp__InvitationEnabled: false
  WhatsApp__WebhookEnabled: false
  WhatsAppAssistant__Enabled: false
  WhatsAppAssistant__WebhookEnabled: false

jobs:
  real-e2e:
    name: Isolated real back-office E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e_pilot
          POSTGRES_PASSWORD: e2e_pilot_only
          POSTGRES_DB: e2e_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_pilot -d e2e_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize receipts
        run: |
          mkdir -p "$E2E_OUTPUT_DIR"
          : > "$E2E_OUTPUT_DIR/timing.jsonl"
          printf '%s\n' '{"workflow":"manual back-office real E2E pilot","target":"localhost only","productionServices":false}' > "$E2E_OUTPUT_DIR/pilot-receipt.json"

      - name: Install npm dependencies
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" npm-install -- npm ci

      - name: Restore API dependencies
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" dotnet-restore -- dotnet restore services/api/YSHeng.sln

      - name: Build API
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" api-build -- dotnet build services/api/src/YSHeng.Api/YSHeng.Api.csproj --no-restore

      - name: Build production back office
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" backoffice-build -- bash -c 'VITE_API_BASE_URL="$E2E_API_BASE_URL" npm --workspace apps/backoffice run build'

      - name: Install Chromium browser
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" browser-install -- npm exec --workspace apps/backoffice -- playwright install --with-deps --only-shell chromium

      - name: Start actual API and wait for readiness
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" api-start-and-ready -- bash infra/testing/start-e2e-pilot-service.sh api

      - name: Start production back office and wait for readiness
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" backoffice-start-and-ready -- bash infra/testing/start-e2e-pilot-service.sh backoffice

      - name: Run real back-office E2E pilot
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" e2e-test -- npm --workspace apps/backoffice run test:e2e:pilot

      - name: Record artifact stage
        if: always()
        run: bash infra/testing/e2e-pilot-timing.sh "$E2E_OUTPUT_DIR/timing.jsonl" artifact-collection -- bash -c 'find "$E2E_OUTPUT_DIR" -maxdepth 3 -type f -print | sort'

      - name: Stop isolated services
        if: always()
        run: bash infra/testing/stop-e2e-pilot-services.sh

      - name: Upload pilot receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-real-e2e-pilot
          path: artifacts/e2e-pilot
          if-no-files-found: error
          retention-days: 7
